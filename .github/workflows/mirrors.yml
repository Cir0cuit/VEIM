name: Mirrors

# The live sweep CI leaves out: every edition resolved against its real mirror,
# weekly, so a broken scraper shows up before a user meets it. A failure names
# the distribution, and GitHub emails the failed run to the repository owner.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # PySide6 needs these X libraries to create widgets, even offscreen.
      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Resolve every edition against its mirror
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -m network -v
