<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- VEIM at 24 px, drawn on its own pixel grid. -->
  <rect width="24" height="24" rx="5" fill="#161b22"/>
  <!-- an edge, so the plate holds its shape on a dark taskbar -->
  <rect x="0.5" y="0.5" width="23" height="23" rx="4.5" fill="none" stroke="#3d444d"/>
  <rect x="3" y="4" width="18" height="7" rx="2" fill="#2f81f7"/>
  <rect x="5" y="6" width="3" height="3" fill="#ffffff"/>
  <rect x="9" y="6" width="9" height="3" fill="#ffffff"/>
  <rect x="5" y="13" width="12" height="2" fill="#8b949e"/>
  <rect x="5" y="17" width="9" height="2" fill="#8b949e"/>
</svg>
