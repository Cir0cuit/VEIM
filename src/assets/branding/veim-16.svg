<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- VEIM at 16 px, drawn on its own pixel grid. -->
  <rect width="16" height="16" rx="3.5" fill="#161b22"/>
  <!-- an edge, so the plate holds its shape on a dark taskbar -->
  <rect x="0.5" y="0.5" width="15" height="15" rx="3.0" fill="none" stroke="#3d444d"/>
  <rect x="2" y="3" width="12" height="5" rx="1" fill="#2f81f7"/>
  <rect x="3" y="4" width="3" height="3" fill="#ffffff"/>
  <rect x="7" y="5" width="6" height="1" fill="#ffffff"/>
  <rect x="3" y="10" width="9" height="1" fill="#8b949e"/>
  <rect x="3" y="12" width="6" height="1" fill="#8b949e"/>
</svg>
