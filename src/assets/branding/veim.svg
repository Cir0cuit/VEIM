<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- VEIM: the Ventoy boot menu it keeps. One entry selected - the image
       you boot - and the rest of the library below it. Drawn on a 64-unit
       grid (16 px at 1024), so every edge lands on a whole pixel at 64 px. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2632"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="select" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4493ff"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#plate)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="218" fill="none"
        stroke="#ffffff" stroke-opacity="0.08" stroke-width="12"/>

  <!-- the selected entry, lifted off the plate -->
  <rect x="160" y="224" width="704" height="192" rx="64" fill="#000000" fill-opacity="0.35"/>
  <rect x="160" y="192" width="704" height="208" rx="64" fill="url(#select)"/>
  <rect x="160" y="192" width="704" height="208" rx="64" fill="none"
        stroke="#ffffff" stroke-opacity="0.22" stroke-width="8"/>
  <!-- its disc -->
  <circle cx="288" cy="296" r="64" fill="#ffffff"/>
  <circle cx="288" cy="296" r="40" fill="none" stroke="#1f6feb" stroke-opacity="0.25" stroke-width="8"/>
  <circle cx="288" cy="296" r="18" fill="#1f6feb"/>
  <!-- its name -->
  <rect x="400" y="272" width="352" height="48" rx="24" fill="#ffffff"/>

  <!-- the rest of the library -->
  <g fill="#7d8590">
    <circle cx="288" cy="528" r="32"/>
    <rect x="368" y="508" width="400" height="40" rx="20"/>
    <circle cx="288" cy="656" r="32"/>
    <rect x="368" y="636" width="320" height="40" rx="20"/>
    <circle cx="288" cy="784" r="32"/>
    <rect x="368" y="764" width="368" height="40" rx="20"/>
  </g>
  <g fill="#0d1117">
    <circle cx="288" cy="528" r="10"/>
    <circle cx="288" cy="656" r="10"/>
    <circle cx="288" cy="784" r="10"/>
  </g>
</svg>
