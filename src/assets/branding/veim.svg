<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2330"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b8dfd"/>
      <stop offset="1" stop-color="#1355c4"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e7681"/>
      <stop offset="0.5" stop-color="#b6c2cf"/>
      <stop offset="1" stop-color="#6e7681"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#plate)"/>
  <rect x="4" y="4" width="1016" height="1016" rx="221" fill="none"
        stroke="#ffffff" stroke-opacity="0.07" stroke-width="8"/>

  <!-- connector -->
  <rect x="424" y="150" width="176" height="164" rx="20" fill="url(#metal)"/>
  <rect x="456" y="196" width="48" height="34" rx="8" fill="#0a0e14" fill-opacity="0.55"/>
  <rect x="520" y="196" width="48" height="34" rx="8" fill="#0a0e14" fill-opacity="0.55"/>

  <!-- body -->
  <rect x="322" y="290" width="380" height="590" rx="60" fill="url(#stick)"/>
  <rect x="322" y="290" width="380" height="590" rx="60" fill="none"
        stroke="#ffffff" stroke-opacity="0.18" stroke-width="6"/>

  <!-- the boot menu: one entry selected, two behind it -->
  <rect x="378" y="470" width="268" height="52" rx="26" fill="#ffffff"/>
  <rect x="378" y="566" width="268" height="52" rx="26" fill="#ffffff" fill-opacity="0.62"/>
  <rect x="378" y="662" width="268" height="52" rx="26" fill="#ffffff" fill-opacity="0.62"/>
</svg>
